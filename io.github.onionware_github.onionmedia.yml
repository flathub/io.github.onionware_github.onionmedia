app-id: io.github.onionware_github.onionmedia
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: OnionMedia_X

build-options:
  no-debuginfo: true
  no-debuginfo-compression: true

finish-args:
  - --filesystem=host
  - --share=network
  - --share=ipc
  - --talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Notifications
  - --socket=x11
  - --device=all

modules:
  - name: Desktop
    buildsystem: simple
    build-commands:
      - cp -r . /app
    sources:
      - type: archive
        url: https://github.com/onionware-github/OnionMedia-X/releases/download/2.0.0.2I/flatpak-resources.zip
        sha256: 14644b5b3f9842253a2cbe1f1942976bffb2d36bdc5fa2a5a40b5cc2fd491bc8
        dest-filename: flatpak-resources.zip
        x-checker-data:
          type: json
          url: https://api.github.com/repos/onionware-github/OnionMedia-X/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="flatpak-resources.zip") | .browser_download_url
  - name: OnionMedia
    buildsystem: simple
    build-commands:
      - cp -r . /app/bin
      - chmod -R +x /app/bin
    sources:
      - type: archive
        url: https://github.com/onionware-github/OnionMedia-X/releases/download/2.0.0.2I/onionware-onionmedia_x-x64.zip
        sha256: 82750c165b0badbcba4bfe5a4c2bc7b23837c97d5c6555f2228fb2508676fdb7
        dest-filename: publish.zip
        x-checker-data:
          type: json
          url: https://api.github.com/repos/onionware-github/OnionMedia-X/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="onionware-onionmedia_x-x64.zip") |
            .browser_download_url
    cleanup:
      - '*.pdb'
      - FluentAvalonia.ProgressRing.xml
      - YoutubeDLSharp.xml
